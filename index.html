<style>
:root{
  --bg:#F2F2F7;--card:#FFFFFF;--card2:#F7F7FA;--ink:#1C1C1E;--text:#3A3A3C;--muted:#8E8E93;--line:rgba(60,60,67,.12);
  --head:rgba(15,23,42,.94);--head-text:#F5F5F7;--head-muted:#A1A9B8;
  --accent:#9D174D;--accent-2:#BE185D;--accent-soft:#FCE7F3;--on-accent:#FFFFFF;
  --ok:#1F7A3A;--ok-dot:#34C759;--ok-soft:#E9F8EE;--warn:#9A4A00;--warn-dot:#FF9500;--warn-soft:#FFF4E5;--bad:#C4001A;--bad-dot:#FF3B30;--bad-soft:#FFECEE;
  --info:#0A5DC2;--info-soft:#E8F1FD;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 28px rgba(15,23,42,.07);--shadow-lg:0 24px 70px rgba(15,23,42,.28);
  --r:22px;--r-sm:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0B0D12;--card:#1C1C1E;--card2:#232327;--ink:#F5F5F7;--text:#E5E5EA;--muted:#98989F;--line:rgba(255,255,255,.10);
  --head:rgba(8,12,22,.92);--head-text:#F5F5F7;--head-muted:#8E95A3;
  --accent:#E0559A;--accent-2:#F06AAE;--accent-soft:rgba(224,85,154,.16);--on-accent:#FFFFFF;
  --ok:#5BE584;--ok-dot:#30D158;--ok-soft:rgba(48,209,88,.14);--warn:#FFB340;--warn-dot:#FF9F0A;--warn-soft:rgba(255,159,10,.15);--bad:#FF6961;--bad-dot:#FF453A;--bad-soft:rgba(255,69,58,.15);
  --info:#64A8FF;--info-soft:rgba(10,132,255,.16);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);--shadow-lg:0 24px 70px rgba(0,0,0,.6);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:manipulation}
button,input,select{font-family:inherit}
button{cursor:pointer;transition:transform .14s ease,background-color .2s ease,box-shadow .2s ease,opacity .2s ease}
button:active{transform:scale(.98)}
header{position:sticky;top:0;z-index:10;background:var(--head);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);color:var(--head-text);padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 28px) 14px calc(env(safe-area-inset-left) + 28px);display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.logo{height:44px;padding:0 13px;border-radius:12px;display:grid;place-items:center;flex:none;background:linear-gradient(180deg,#1E2740,#0B101C);box-shadow:inset 0 0 0 1px rgba(227,203,170,.28),0 2px 10px rgba(0,0,0,.35)}.logo span{font-family:"Lora","Iowan Old Style","Palatino","Georgia",serif;font-weight:600;font-size:17px;letter-spacing:.08em;background:linear-gradient(180deg,#F6EBDC,#E3CBAA 55%,#C4A27A);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.brand b{display:block;font-size:17px;font-weight:600;letter-spacing:-.01em}
.brand small{display:block;font-size:12.5px;color:var(--head-muted);margin-top:1px}
.hright{display:flex;align-items:center;gap:20px}
.clock{font-size:36px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1;text-align:right}
.date{font-size:12.5px;color:var(--head-muted);text-align:right;margin-top:4px}
.gear{position:relative;width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:var(--head-text);display:grid;place-items:center}
.gear svg{width:22px;height:22px}
.badge{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bad-dot);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid #0F172A}
.badge.warn{background:var(--warn-dot)}
main{padding:28px calc(env(safe-area-inset-right) + 28px) 12px calc(env(safe-area-inset-left) + 28px);max-width:1180px;margin:0 auto}
.greet{display:flex;align-items:baseline;justify-content:space-between;margin:2px 4px 18px;gap:12px;flex-wrap:wrap}
.greet h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.greet span{font-size:15px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.tile{position:relative;background:var(--card);border:0;border-radius:var(--r);padding:22px;text-align:left;color:inherit;min-height:176px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);overflow:hidden}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid var(--line);pointer-events:none}
.tile .top{display:flex;align-items:center;gap:14px}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:21px;font-weight:600;background:var(--accent-soft);color:var(--accent);flex:none}
.tile .nm{font-size:22px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.tile .rl{font-size:13.5px;color:var(--muted);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600;padding:8px 12px;border-radius:999px;background:var(--card2);color:var(--muted)}
.pill i{width:9px;height:9px;border-radius:50%;background:currentColor;display:inline-block}
.tile.work .pill{background:var(--ok-soft);color:var(--ok)}
.tile.pause .pill{background:var(--warn-soft);color:var(--warn)}
.tile.work .pill i{background:var(--ok-dot);box-shadow:0 0 0 0 rgba(52,199,89,.5);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,199,89,.45)}70%{box-shadow:0 0 0 8px rgba(52,199,89,0)}100%{box-shadow:0 0 0 0 rgba(52,199,89,0)}}
.live{font-size:30px;font-weight:600;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:14px}
.live small{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:4px}
.flag{font-size:12.5px;color:var(--bad);font-weight:600;margin-top:4px}
.empty{background:var(--card);border-radius:var(--r);padding:44px;text-align:center;color:var(--muted);box-shadow:var(--shadow)}
.empty h2{color:var(--ink);font-size:22px;margin:0 0 8px}
footer{max-width:1180px;margin:8px auto 30px;padding:0 calc(env(safe-area-inset-right) + 32px) env(safe-area-inset-bottom) calc(env(safe-area-inset-left) + 32px);font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
/* Sheets */
.modal{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.32);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:fade .2s ease}
.box{background:var(--card);color:var(--text);border-radius:28px;padding:30px;width:100%;max-width:470px;max-height:calc(100vh - 48px);overflow:auto;-webkit-overflow-scrolling:touch;box-shadow:var(--shadow-lg);animation:sheet .32s cubic-bezier(.2,.9,.25,1)}
.box.wide{max-width:900px}
@keyframes fade{from{opacity:0}}
@keyframes sheet{from{opacity:0;transform:translateY(18px) scale(.98)}}
.box h3{margin:0 0 4px;font-size:26px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.sub{color:var(--muted);font-size:15px;margin-bottom:20px;line-height:1.4}
.pins{display:flex;gap:18px;justify-content:center;margin:12px 0 10px}
.pins span{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--muted);transition:background .15s,border-color .15s,transform .15s}
.pins span.on{background:var(--ink);border-color:var(--ink);transform:scale(1.05)}
.pins.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.err{color:var(--bad);text-align:center;font-weight:600;font-size:14px;min-height:22px;margin-bottom:10px}
.pad{display:grid;grid-template-columns:repeat(3,84px);gap:18px 26px;justify-content:center;padding-bottom:4px}
.pad button{width:84px;height:84px;border-radius:50%;border:0;background:var(--card2);color:var(--ink);font-size:32px;font-weight:400;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line)}
.pad button:active{background:var(--line);transform:scale(.94)}
.pad button.fn{background:transparent;box-shadow:none;font-size:15px;font-weight:500;color:var(--accent)}
.acts{display:grid;gap:12px}
.act{border:0;border-radius:18px;padding:20px;font-size:21px;font-weight:600;color:var(--on-accent);background:var(--accent);display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 18px rgba(157,23,77,.18)}
.act.in{background:#1F9D4C;box-shadow:0 6px 18px rgba(31,157,76,.22)}
.act.out{background:#3A3A3C;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.act.ps{background:#E07800;box-shadow:0 6px 18px rgba(224,120,0,.22)}
.act.pe{background:#0A6CDB;box-shadow:0 6px 18px rgba(10,108,219,.22)}
.act.sec{background:var(--card2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);font-size:17px;font-weight:500;padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.done{text-align:center;padding:6px 0}
.check{width:76px;height:76px;border-radius:50%;margin:4px auto 14px;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok)}
.check svg{width:38px;height:38px}
.done .big{font-size:58px;font-weight:600;letter-spacing:-.03em;color:var(--ink);font-variant-numeric:tabular-nums}
.done .msg{font-size:21px;font-weight:600;color:var(--ink);margin-top:4px}

<body>
<header>
  <div class="brand"><div class="logo" aria-label="SVNC"><span>SVNC</span></div><div><b>SVNC Hair &amp; Beauty</b><small>Zeiterfassung</small></div></div>
  <div class="hright"><div><div class="clock" id="clock">--:--</div><div class="date" id="date"></div></div>
    <button class="gear" id="btn-admin" aria-label="Salonleitung"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span id="gbadge"></span></button>
  </div>
</header>
<main id="app"></main>
<footer><span id="foot1"></span><span>Zeiten werden auf diesem Gerät gespeichert. Korrekturen nur durch die Salonleitung.</span></footer>
<div id="modal"></div>

<script>
/* ======================================================================
   SVNC Zeiterfassung (iPad) · Daten lokal auf diesem Gerät
   Auto-Speichern in eine Datei, wo der Browser es erlaubt (Chrome am Mac/PC).
   Safari auf dem iPad erlaubt das nicht -> Übertragen per Teilen-Dialog.
   ====================================================================== */
const LS = 'svnc_stempel_v1';
const p2 = n => String(n).padStart(2, '0');
const dkey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); };
const hm = ts => { const d = new Date(ts); return p2(d.getHours()) + ':' + p2(d.getMinutes()); };
const dfmt = s => s.slice(8, 10) + '.' + s.slice(5, 7) + '.' + s.slice(0, 4);
const tsAt = (day, t) => { const [y, m, d] = day.split('-').map(Number), [h, mi] = t.split(':').map(Number); return new Date(y, m - 1, d, h, mi, 0, 0).getTime(); };
const wdMon = day => (new Date(day + 'T12:00').getDay() + 6) % 7; // Mo=0 … So=6 (wie Personalplanung)
const WDS = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'], WDL = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];
const MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const dec1 = h => (Math.round(h * 10) / 10).toFixed(1).replace('.', ',');
const hmin = m => m == null ? '–' : Math.floor(m / 60) + ':' + p2(Math.round(m % 60));
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = s => document.querySelector(s);
const TYPES = { in: 'Kommen', ps: 'Pause Beginn', pe: 'Pause Ende', out: 'Gehen' };
const today = () => dkey(Date.now()), yesterday = () => dkey(Date.now() - 86400000);
// Öffnungszeiten-Standard (wie Personalplanung): Di–Fr 09–13 / 14–18, Sa 08–14 ohne Mittagspause
const DEF_HOURS = [{}, { a1: '09:00', a2: '13:00', b1: '14:00', b2: '18:00' }, { a1: '09:00', a2: '13:00', b1: '14:00', b2: '18:00' }, { a1: '09:00', a2: '13:00', b1: '14:00', b2: '18:00' }, { a1: '09:00', a2: '13:00', b1: '14:00', b2: '18:00' }, { a1: '08:00', a2: '14:00' }, {}];

let D;
function load() {
  try { D = JSON.parse(localStorage.getItem(LS)) || null; } catch (e) { D = null; }
  if (!D) D = { team: [], pins: {}, admin: '', salt: rnd(16), events: [], device: 'iPad-' + rnd(4), lastExport: 0, fails: {} };
  D.fails = D.fails || {}; D.log = D.log || []; D.unsynced = D.unsynced || 0; D.hours = D.hours || null; D.vacReqs = D.vacReqs || []; D.vacAdj = D.vacAdj || {};
}
function store(changed) { if (changed) D.unsynced = (D.unsynced || 0) + 1; try { localStorage.setItem(LS, JSON.stringify(D)); } catch (e) { alert('Speichern auf diesem Gerät nicht möglich!'); } if (changed) autoQueue(); }
function logx(x) { D.log.push({ ts: Date.now(), x }); if (D.log.length > 3000) D.log.splice(0, D.log.length - 3000); }
function rnd(n) { const a = new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a, b => b.toString(16).padStart(2, '0')).join(''); }
async function hash(s) {
  const data = new TextEncoder().encode(D.salt + '|' + s);
  if (crypto.subtle) { const h = await crypto.subtle.digest('SHA-256', data); return Array.from(new Uint8Array(h), b => b.toString(16).padStart(2, '0')).join(''); }
  let h = 5381; for (const b of data) h = ((h << 5) + h + b) >>> 0; return 'x' + h.toString(16);
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

/* ---------- Tagesauswertung inkl. fester Mittagspause ---------- */
const hoursOf = day => ((D.hours || DEF_HOURS)[wdMon(day)]) || {};
function lunchOf(day) { const h = hoursOf(day); return h.a2 && h.b1 ? [tsAt(day, h.a2), tsAt(day, h.b1)] : null; }
function closeOf(day) { const h = hoursOf(day); const c = h.b2 || h.a2; return c ? tsAt(day, c) : null; }
const live = () => D.events.filter(e => !e.del);
function evsOf(p, day) { return live().filter(e => e.p === p && dkey(e.ts) === day).sort((a, b) => a.ts - b.ts); }
function stateOf(p, day) { const ev = evsOf(p, day); if (!ev.length) return 'off'; const l = ev[ev.length - 1].t; return l === 'in' || l === 'pe' ? 'work' : l === 'ps' ? 'pause' : 'gone'; }
function daySum(p, day, now) {
  const ev = evsOf(p, day); const r = { b: null, e: null, open: false, pm: 0, pa: null, net: null, lunch: 0, n: ev.length };
  if (!ev.length) return r;
  const iv = []; let mark = null;
  ev.forEach(x => {
    if (x.t === 'in') { if (r.b == null) r.b = x.ts; else if (mark != null) iv.push([mark, x.ts]); mark = null; }
    else if (x.t === 'ps') { mark = x.ts; }
    else if (x.t === 'pe') { if (mark != null) iv.push([mark, x.ts]); mark = null; }
    else if (x.t === 'out') { r.e = x.ts; mark = x.ts; }
  });
  const last = ev[ev.length - 1];
  if (last.t !== 'out') { r.e = null; r.open = true; }
  const end = r.e != null ? r.e : (now && day === today() ? now : null);
  if (r.open && last.t === 'ps' && end) iv.push([last.ts, end]);
  if (r.b == null || end == null) return r;
  const L = lunchOf(day); // feste Salon-Mittagspause Di–Fr
  if (L) { const a = Math.max(L[0], r.b), z = Math.min(L[1], end); if (z > a) { iv.push([a, z]); } }
  iv.sort((x, y) => x[0] - y[0]); const mg = [];
  iv.forEach(v => { if (v[1] <= v[0]) return; const t = mg[mg.length - 1]; if (t && v[0] <= t[1]) t[1] = Math.max(t[1], v[1]); else mg.push([v[0], v[1]]); });
  const pauseMs = mg.reduce((s, v) => s + v[1] - v[0], 0);
  if (L) { const a = Math.max(L[0], r.b), z = Math.min(L[1], end); r.lunch = z > a ? Math.round((z - a) / 60000) : 0; }
  r.pm = Math.round(pauseMs / 60000); r.pa = mg.length ? mg[0][0] : null;
  r.net = Math.max(0, Math.round((end - r.b) / 60000) - r.pm);
  return r;
}
function seqCheck(ev) { // Reihenfolge prüfen
  let st = 'off';
  for (const x of ev) {
    const ok = { in: st === 'off' || st === 'gone', ps: st === 'work', pe: st === 'pause', out: st === 'work' || st === 'pause' }[x.t];
    if (!ok) return `„${TYPES[x.t]}“ um ${hm(x.ts)} passt nicht zur Reihenfolge.`;
    st = { in: 'work', ps: 'pause', pe: 'work', out: 'gone' }[x.t];
  }
  return '';
}
/* Jugendarbeitsschutz bis zum Tag vor dem 18. Geburtstag */
function adultFrom(m) { if (!m || !m.birth) return null; const [y, mo, d] = m.birth.split('-').map(Number); return (y + 18) + '-' + p2(mo) + '-' + p2(d); }
function jugAt(m, day) { const a = adultFrom(m); return a ? day < a : !!(m && m.jug); }
function requiredPause(netMin, jug) { const h = netMin / 60; return jug ? (h > 6 ? 60 : h > 4.5 ? 30 : 0) : (h > 9 ? 45 : h > 6 ? 30 : 0); }
function issues() { // offene Schichten (Vortage) und heute nach Ladenschluss offen
  const out = [], now = Date.now(), t = today();
  D.team.forEach(m => {
    for (let k = 1; k <= 31; k++) { const day = dkey(now - k * 86400000), ev = evsOf(m.p, day); if (ev.length && ev[ev.length - 1].t !== 'out') out.push({ p: m.p, name: m.name, day, kind: 'open' }); }
    const c = closeOf(t), st = stateOf(m.p, t); if (c && now > c + 30 * 60000 && (st === 'work' || st === 'pause')) out.push({ p: m.p, name: m.name, day: t, kind: 'late' });
  });
  return out;
}

/* ---------- Automatisches Speichern in Datei (File System Access API) ---------- */
const FS_OK = !!window.showSaveFilePicker;
const AUTO = { handle: null, ok: false, last: 0, err: '', timer: null, name: '' };
function idb() { return new Promise((res, rej) => { const r = indexedDB.open('svnc_zeit', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbSet(k, v) { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); if (v == null) tx.objectStore('kv').delete(k); else tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function idbGet(k) { const db = await idb(); return new Promise((res, rej) => { const r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
const exportData = () => ({ kind: 'svnc-stempel', version: 3, device: D.device, exported: Date.now(), events: D.events, log: D.log, vacReqs: D.vacReqs, vacAdj: D.vacAdj });
async function autoInit() {
  if (!FS_OK) return;
  try { const h = await idbGet('handle'); if (!h) return; AUTO.handle = h; AUTO.name = h.name;
    AUTO.ok = (await h.queryPermission({ mode: 'readwrite' })) === 'granted'; if (AUTO.ok && D.unsynced) autoWrite(); } catch (e) { AUTO.err = 'Verknüpfung nicht lesbar'; }
  refreshChrome();
}
async function autoLink() {
  try { const h = await showSaveFilePicker({ suggestedName: 'SVNC_Stempelzeiten.json', types: [{ description: 'SVNC Stempelzeiten', accept: { 'application/json': ['.json'] } }] });
    AUTO.handle = h; AUTO.name = h.name; AUTO.ok = true; AUTO.err = ''; await idbSet('handle', h); logx('OneDrive-Verknüpfung eingerichtet: ' + h.name); store(); await autoWrite(); admin('status');
  } catch (e) { if (e.name !== 'AbortError') alert('Datei konnte nicht gewählt werden: ' + e.message); }
}
async function autoResume() { if (!AUTO.handle) return; try { AUTO.ok = (await AUTO.handle.requestPermission({ mode: 'readwrite' })) === 'granted'; if (AUTO.ok) { AUTO.err = ''; await autoWrite(); } } catch (e) { AUTO.err = e.message; } admin('status'); }
async function autoUnlink() { AUTO.handle = null; AUTO.ok = false; AUTO.name = ''; await idbSet('handle', null); logx('OneDrive-Verknüpfung getrennt'); store(); admin('status'); }
function autoQueue() { odQueue(); if (!AUTO.ok) { refreshChrome(); return; } clearTimeout(AUTO.timer); AUTO.timer = setTimeout(autoWrite, 800); }
async function autoWrite() {
  if (!AUTO.handle || !AUTO.ok) return; clearTimeout(AUTO.timer); AUTO.timer = null;

const OD_KEY = 'svnc_od_v1', OD_FILE = 'SVNC_Stempelzeiten.json';

      if (Array.isArray(o.hours) && o.hours.length === 7) D.hours = o.hours.map(h => ({ a1: h.a1, a2: h.a2, b1: h.b1, b2: h.b2 }));
      logx('Team geladen: ' + D.team.map(m => m.name).join(', ')); store(); admin('team'); } catch (e) { alert('Die Datei ist keine gültige Personalplanung.'); } };
  rd.readAsText(f);
}
function mergeObj(o) {
  if (!o || o.kind !== 'svnc-stempel') throw new Error('Keine gültige Stempeldatei');
  const map = new Map(D.events.map(e => [e.id, e])); let n = 0;
  (o.events || []).forEach(e => { const c = map.get(e.id); if (!c) { D.events.push(e); n++; } else if ((e.rev || 1) > (c.rev || 1)) { Object.assign(c, e); n++; } });
  const vm = new Map(D.vacReqs.map(r => [r.id, r]));
  (o.vacReqs || []).forEach(r => { const c = vm.get(r.id); if (!c) { D.vacReqs.push(r); n++; } else if ((r.rev || 1) > (c.rev || 1)) { Object.assign(c, r); n++; } });
  if (o.vacAdj) { const b = JSON.stringify(D.vacAdj); D.vacAdj = mergeAdj(D.vacAdj, o.vacAdj); if (JSON.stringify(D.vacAdj) !== b) n++; }
  const seen = new Set(D.log.map(l => l.ts + l.x)); (o.log || []).forEach(l => { if (!seen.has(l.ts + l.x)) D.log.push(l); }); D.log.sort((a, b) => a.ts - b.ts);
  if (D.log.length > 3000) D.log.splice(0, D.log.length - 3000);
  return n;
}
function mergeFile(inp) {
  const f = inp.files[0]; if (!f) return; const rd = new FileReader();
  rd.onload = () => { try { const n = mergeObj(JSON.parse(rd.result)); logx(`Stempeldatei zusammengeführt: ${n} Stempelungen übernommen`); store(true); admin('team'); alert(n + ' Stempelungen übernommen.'); } catch (e) { alert('Keine gültige Stempeldatei.'); } };
  rd.readAsText(f);
}

/* ---------- Urlaub: Anträge, Konto, Freigabe ---------- */
const addDay = (ds, n) => { const [y, m, d] = ds.split('-').map(Number); return dkey(new Date(y, m - 1, d + n).getTime()); };
const dsh = ds => WDS[wdMon(ds)] + ', ' + Number(ds.slice(8, 10)) + '.' + Number(ds.slice(5, 7)) + '.';
const nf = x => { const r = Math.round(x * 2) / 2; return (r % 1 ? r.toFixed(1) : String(r)).replace('.', ','); };
const VST = { pending: ['Offen', 'warn'], approved: ['Genehmigt', 'ok'], rejected: ['Abgelehnt', 'bad'], withdrawn: ['Zurückgezogen', 'off'], cancelled: ['Storniert', 'off'] };
const span = r => r.from === r.to ? dsh(r.from) + (r.half ? ' (½ Tag)' : '') : dsh(r.from) + ' – ' + dsh(r.to);
function isWork(m, ds) {
  const h = hoursOf(ds); if (!h.a1) return false;
  if (m.days && !m.days[wdMon(ds)]) return false;
  const C = D.cal || {}; if ((C.holidays || []).includes(ds)) return false;
  if ((C.closures || []).some(c => c.from && c.to && c.from <= ds && ds <= c.to)) return false;
  if (m.entry && ds < m.entry) return false; return true;
}
function reqDays(r) { const m = D.team.find(x => x.p === r.p) || {}, out = {};
  for (let d = r.from; d <= r.to; d = addDay(d, 1)) if (isWork(m, d)) { const y = d.slice(0, 4); out[y] = (out[y] || 0) + (r.half ? 0.5 : 1); } return out; }
const sumV = o => Object.values(o).reduce((a, b) => a + b, 0);
function adjOf(p, y) { return (((D.vacAdj || {})[p] || {})[y] || []).filter(a => !a.del); }
const adjKey = a => a.id || (a.ts + '|' + a.x + '|' + a.n);
function mergeAdj(dst, src) { dst = dst || {}; Object.entries(src || {}).forEach(([p, ys]) => Object.entries(ys || {}).forEach(([y, list]) => {
  const cur = ((dst[p] = dst[p] || {})[y] = dst[p][y] || []), map = new Map(cur.map(a => [adjKey(a), a]));
  (list || []).forEach(a => { const c = map.get(adjKey(a)); if (!c) { cur.push(Object.assign({}, a)); map.set(adjKey(a), cur[cur.length - 1]); } else if (a.del && !c.del) c.del = a.del; }); })); return dst; }
function acct(p, y) {
  const m = D.team.find(x => x.p === p) || {}, base = y === '2026' ? m.v26 : y === '2027' ? m.v27 : null;
  const adj = adjOf(p, y).reduce((s, a) => s + a.n, 0), sn = D.snap || {}, used = ((sn.used || {})[p] || {})[y] || 0, applied = new Set(sn.applied || []);
  let appr = 0, pend = 0;
  D.vacReqs.forEach(r => { if (r.p !== p) return; const n = reqDays(r)[y] || 0; if (r.status === 'approved' && !applied.has(r.id)) appr += n; if (r.status === 'pending') pend += n; });
  const booked = used + appr;
  if (base == null && !adj) return { none: true, booked, pend };
  const total = (base || 0) + adj; return { total, base: base || 0, adj, booked, pend, rest: total - booked, after: total - booked - pend };
}
const vacYears = () => { const y = Number(today().slice(0, 4)); return [String(y), String(y + 1)].filter(x => x <= '2027'); };
function acctTiles(p, y, big) {
  const a = acct(p, y);
  if (a.none) return `<div class="note info" style="margin-top:10px">${y}: Kein Urlaubskonto in der Personalplanung hinterlegt.</div>`;
  const rc = a.rest < 0 ? 'var(--bad)' : (a.booked > 0 && a.rest <= Math.max(1, a.total * 0.2)) ? 'var(--warn)' : 'var(--ok)';
  return `<div class="vacc ${big ? '' : 'mini'}"><div class="vy">${y}${y === '2026' && D.snap && D.snap.vacFrom2026 ? ` <span>ab ${dfmt(D.snap.vacFrom2026)}</span>` : ''}</div>
    <div class="kpis" style="margin-top:8px"><div class="kpi"><div class="l">Anspruch</div><div class="v">${nf(a.total)}</div>${a.adj ? `<div class="small">inkl. ${a.adj > 0 ? '+' : ''}${nf(a.adj)} Korrektur</div>` : ''}</div>
    <div class="kpi"><div class="l">Verplant / genommen</div><div class="v">${nf(a.booked)}</div></div>
    <div class="kpi"><div class="l">Beantragt (offen)</div><div class="v">${nf(a.pend)}</div></div>
    <div class="kpi" style="box-shadow:inset 0 0 0 1.5px ${rc}"><div class="l">Resturlaub</div><div class="v" style="color:${rc}">${nf(a.rest)}</div>${a.pend ? `<div class="small">nach offenen Anträgen ${nf(a.after)}</div>` : ''}</div></div></div>`;
}
const snapNote = () => D.snap && D.snap.at ? `Stand Personalplanung: ${dfmt(dkey(D.snap.at))}` : 'Hinweis: Urlaub aus der Personalplanung noch nicht geladen (Team neu laden)';
function overlaps(r) { // andere Personen im selben Zeitraum
  const out = [], booked = (D.snap && D.snap.booked) || {};
  D.team.forEach(m => { if (m.p === r.p) return; const ds = [];
    (booked[m.p] || []).forEach(([d]) => { if (d >= r.from && d <= r.to) ds.push(d); });
    D.vacReqs.forEach(o => { if (o.p !== m.p || !['approved', 'pending'].includes(o.status)) return; for (let d = o.from; d <= o.to; d = addDay(d, 1)) if (d >= r.from && d <= r.to && isWork(m, d)) ds.push(d); });
    const u = [...new Set(ds)].sort(); if (u.length) out.push(m.name + ' (' + u.map(d => Number(d.slice(8, 10)) + '.' + Number(d.slice(5, 7)) + '.').slice(0, 6).join(', ') + (u.length > 6 ? ' …' : '') + ')'); });
  return out;
}
function ownClash(r) { const booked = ((D.snap && D.snap.booked) || {})[r.p] || [], hit = [];
  booked.forEach(([d]) => { if (d >= r.from && d <= r.to) hit.push(d); });
  D.vacReqs.forEach(o => { if (o.p !== r.p || o.id === r.id || !['approved', 'pending'].includes(o.status)) return; if (o.from <= r.to && o.to >= r.from) hit.push(o.from); });
  return hit.length; }

/* Mitarbeiter-Ansicht */
function vac(p) {
  const m = D.team.find(x => x.p === p), mine = D.vacReqs.filter(r => r.p === p).sort((a, b) => b.created - a.created);
  mine.forEach(r => { if (r.decided && !r.seen) { r.seen = Date.now(); } }); store();
  const t = today();
  const list = mine.slice(0, 12).map(r => { const [lab, cls] = VST[r.status];
    return `<div class="row"><div><div class="t">${span(r)}</div><div class="d">${nf(sumV(reqDays(r)))} Arbeitstage${r.note ? ' · ' + esc(r.note) : ''}${r.reason ? ' · Antwort: ' + esc(r.reason) : ''}</div></div>
      <div class="btns"><span class="vst ${cls}">${lab}</span>${r.status === 'pending' ? `<button class="btn danger" onclick="vacWithdraw('${r.id}',${p})">Zurückziehen</button>` : ''}</div></div>`; }).join('');
  modal(`<div class="ahead"><div><h3>Urlaub</h3><div class="sub" style="margin:0">${esc(m.name)} · ${snapNote()}</div></div><button class="btn" onclick="actions(${p})">Zurück</button></div>
   ${vacYears().map((y, i) => acctTiles(p, y, i === 0)).join('')}
   <div class="gt">Neuer Antrag</div>
   <div class="group" style="padding:16px 18px">
     <div class="grid2"><label class="fl">Von<input type="date" id="vf" min="${t}" max="2027-12-31" value="${t}"></label><label class="fl">Bis<input type="date" id="vt" min="${t}" max="2027-12-31" value="${t}"></label></div>
     <label class="tgl"><input type="checkbox" id="vh"><span></span>Halber Tag</label>
     <input type="text" id="vn" placeholder="Bemerkung (optional)" maxlength="120" style="margin-top:12px">
     <div id="vcalc" class="note info">Bitte Zeitraum wählen.</div>
     <button class="act" id="vsend" style="width:100%;margin-top:14px" disabled onclick="vacSend(${p})">Antrag stellen</button>
   </div>
   <div class="gt">Meine Anträge</div><div class="group">${list || '<div class="row"><div class="small">Noch keine Anträge.</div></div>'}</div>`, true);
  ['vf', 'vt', 'vh'].forEach(id => $('#' + id).addEventListener('input', () => vacCalc(p)));
  ['vf', 'vt', 'vh'].forEach(id => $('#' + id).addEventListener('change', () => vacCalc(p)));
  vacCalc(p); idle(150);
}
function vacDraft(p) { const f = $('#vf').value, t = $('#vt').value, single = f && f === t;
  $('#vh').disabled = !single; if (!single) $('#vh').checked = false;
  return { id: '_draft', p, from: f, to: t, half: single && $('#vh').checked }; }
function vacCalc(p) {
  idle(150); const r = vacDraft(p), out = $('#vcalc'), btn = $('#vsend');
  if ($('#vf').value && $('#vt').value < $('#vf').value) { $('#vt').value = $('#vf').value; return vacCalc(p); }
  if (!r.from || !r.to) { out.className = 'note info'; out.textContent = 'Bitte Zeitraum wählen.'; btn.disabled = true; return; }
  if (r.from < today()) { out.className = 'note bad'; out.textContent = 'Der Beginn liegt in der Vergangenheit.'; btn.disabled = true; return; }
  const per = reqDays(r), tot = sumV(per);
  if (!tot) { out.className = 'note bad'; out.textContent = 'In diesem Zeitraum hast du keine Arbeitstage (frei, Feiertag oder Salon geschlossen).'; btn.disabled = true; return; }
  const parts = Object.entries(per).map(([y, n]) => { const a = acct(p, y); return a.none ? `${y}: ${nf(n)} Tage` : `${y}: ${nf(n)} von ${nf(a.after)} verfügbaren Tagen → danach <b>${nf(a.after - n)}</b>`; });
  const short = Object.entries(per).some(([y, n]) => { const a = acct(p, y); return !a.none && a.after - n < 0; });
  const clash = ownClash(r);
  out.className = 'note ' + (short ? 'bad' : 'ok');
  out.innerHTML = `<b>${nf(tot)} Arbeitstag${tot === 1 ? '' : 'e'}</b> · ${parts.join(' · ')}${short ? '<br>Der Resturlaub reicht nicht. Du kannst den Antrag trotzdem stellen, die Salonleitung entscheidet.' : ''}${clash ? '<br>Achtung: Überschneidet sich mit bereits eingetragenem oder beantragtem Urlaub.' : ''}`;
  btn.disabled = false;
}
function vacSend(p) {
  const m = D.team.find(x => x.p === p), r = vacDraft(p), note = $('#vn').value.trim();
  const req = { id: rnd(8), p, name: m.name, from: r.from, to: r.to, half: !!r.half, note, status: 'pending', created: Date.now(), rev: 1, days: sumV(reqDays(r)) };
  D.vacReqs.push(req); logx(`Urlaubsantrag ${m.name}: ${span(req)}, ${nf(req.days)} Tage`); store(true);
  modal(`<div class="done"><div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><div class="msg">Antrag gestellt</div><div class="sub" style="margin:8px 0 0">${span(req)} · ${nf(req.days)} Arbeitstage<br>Die Salonleitung wird informiert.</div></div><button class="act sec" style="width:100%;margin-top:18px" onclick="home()">Fertig</button>`);
  idle(8);
}
function vacWithdraw(id, p) { const r = D.vacReqs.find(x => x.id === id); if (!r || r.status !== 'pending' || !confirm('Antrag zurückziehen?')) return;
  r.status = 'withdrawn'; r.rev++; logx(`Urlaubsantrag ${r.name} ${span(r)} zurückgezogen`); store(true); vac(p); }

/* Admin-Bereich */
function aVac() {
  const pend = D.vacReqs.filter(r => r.status === 'pending').sort((a, b) => a.from < b.from ? -1 : 1);
  const inbox = pend.map(r => { const per = reqDays(r), y = r.from.slice(0, 4), a = acct(r.p, y), n = per[y] || 0, ov = overlaps(r), own = ownClash(r);
    const after = a.none ? null : a.rest - n, rc = after == null ? 'var(--muted)' : after < 0 ? 'var(--bad)' : 'var(--ok)';
    return `<div class="req"><div class="rq-h"><div style="display:flex;gap:12px;align-items:center"><div class="av" style="width:44px;height:44px;font-size:17px">${esc(r.name.slice(0, 1))}</div><div><div class="t" style="font-size:17px;font-weight:600">${esc(r.name)}</div><div class="d">${span(r)} · <b>${nf(sumV(per))} Arbeitstage</b> · gestellt ${dfmt(dkey(r.created))}</div></div></div>
      <div class="rq-k">${a.none ? '<span class="small">kein Konto</span>' : `<span class="small">Rest ${y}</span><b>${nf(a.rest)}</b><span class="small">→</span><b style="color:${rc}">${nf(after)}</b>`}</div></div>
      ${r.note ? `<div class="small" style="margin-top:8px">„${esc(r.note)}“</div>` : ''}
      ${ov.length ? `<div class="note" style="margin-top:10px">Gleichzeitig weg: ${esc(ov.join('; '))}</div>` : ''}${own ? '<div class="note bad" style="margin-top:10px">Überschneidet sich mit eigenem Urlaub.</div>' : ''}${after != null && after < 0 ? '<div class="note bad" style="margin-top:10px">Resturlaub reicht nicht.</div>' : ''}
      <div class="btns" style="margin-top:12px"><input type="text" id="rr-${r.id}" placeholder="Antwort (optional)" style="flex:1;min-width:180px"><button class="btn danger" onclick="vacDecide('${r.id}','rejected')">Ablehnen</button><button class="btn pri ok" onclick="vacDecide('${r.id}','approved')">Genehmigen</button></div></div>`; }).join('');
  const ys = vacYears();
  const konten = D.team.map(m => ys.map((y, i) => { const a = acct(m.p, y);
    return `<tr><td>${i ? '' : `<b>${esc(m.name)}</b>`}</td><td>${y}</td>${a.none ? '<td class="r" colspan=5 style="color:var(--muted)">nicht hinterlegt</td>' : `<td class="r">${nf(a.base)}</td><td class="r">${a.adj ? (a.adj > 0 ? '+' : '') + nf(a.adj) : '–'}</td><td class="r">${nf(a.booked)}</td><td class="r">${a.pend ? nf(a.pend) : '–'}</td><td class="r"><b style="color:${a.rest < 0 ? 'var(--bad)' : 'var(--ink)'}">${nf(a.rest)}</b></td>`}<td class="r"><button class="btn" style="padding:7px 12px" onclick="vacAdjForm(${m.p},'${y}')">Anpassen</button></td></tr>`; }).join('')).join('');
  const t = today(), appr = D.vacReqs.filter(r => r.status === 'approved' && r.to >= t).sort((a, b) => a.from < b.from ? -1 : 1);
  const applied = new Set((D.snap && D.snap.applied) || []);
  const up = appr.map(r => `<div class="row"><div><div class="t">${esc(r.name)} · ${span(r)}</div><div class="d">${nf(sumV(reqDays(r)))} Arbeitstage · ${applied.has(r.id) ? 'im Monatsplan eingetragen' : 'wird beim nächsten Abholen in den Monatsplan übernommen'}</div></div><button class="btn danger" onclick="vacDecide('${r.id}','cancelled')">Stornieren</button></div>`).join('');
  return `<div class="gt">Offene Anträge</div>${inbox || '<div class="group"><div class="row"><div style="display:flex;gap:12px;align-items:center"><span class="dot ok"></span><div class="t">Keine offenen Anträge</div></div></div></div>'}
   <div class="gt">Urlaubskonten · ${snapNote()}</div><div class="group" style="padding:4px 14px"><table><tr><th>Mitarbeiter(in)</th><th>Jahr</th><th class="r">Anspruch</th><th class="r">Korrektur</th><th class="r">Verplant</th><th class="r">Beantragt</th><th class="r">Rest</th><th></th></tr>${konten}</table></div>
   <div class="gt">Genehmigter Urlaub (kommend)</div><div class="group">${up || '<div class="row"><div class="small">Kein kommender Urlaub genehmigt.</div></div>'}</div>
   <p class="small">Genehmigte Anträge werden beim nächsten „Stempelzeiten abholen“ in der Personalplanung automatisch als Urlaub (U bzw. ½ Urlaub) in den Monatsplan eingetragen und vom Urlaubskonto abgezogen. Korrekturen hier (z. B. Resturlaub aus dem Vorjahr) werden ebenfalls übernommen.</p>`;
}
function vacDecide(id, st) {
  const r = D.vacReqs.find(x => x.id === id); if (!r) return; const inp = $('#rr-' + id), reason = inp ? inp.value.trim() : '';
  if (st === 'approved') { const y = r.from.slice(0, 4), a = acct(r.p, y), n = reqDays(r)[y] || 0; if (!a.none && a.rest - n < 0 && !confirm(`Der Resturlaub von ${r.name} reicht nicht (${nf(a.rest)} Tage, beantragt ${nf(n)}). Trotzdem genehmigen?`)) return; }
  if (st === 'cancelled' && !confirm(`Genehmigten Urlaub von ${r.name} (${span(r)}) stornieren?`)) return;
  r.status = st; r.reason = reason; r.decided = Date.now(); r.seen = 0; r.rev = (r.rev || 1) + 1;
  logx(`Urlaub ${r.name} ${span(r)}: ${VST[st][0]}${reason ? ' – ' + reason : ''}`); store(true); admin('vac');
}
function vacAdjForm(p, y) {
  const m = D.team.find(x => x.p === p), list = adjOf(p, y).map(a => `<div class="row"><div><div class="t">${a.n > 0 ? '+' : ''}${nf(a.n)} Tage</div><div class="d">${esc(a.x || '')} · ${dfmt(dkey(a.ts))}</div></div></div>`).join('');
  modal(`<div class="ahead"><h3>Urlaubskonto anpassen</h3><button class="btn" onclick="admin('vac')">Zurück</button></div><div class="sub">${esc(m.name)} · ${y}</div>
   ${acctTiles(p, y, true)}
   <div class="gt">Korrektur hinzufügen</div><div class="group" style="padding:16px 18px">
    <div class="stepper"><button class="btn" onclick="adjStep(-0.5)">−</button><input type="text" inputmode="decimal" id="an" value="0"><button class="btn" onclick="adjStep(0.5)">+</button><span class="small">Tage (z. B. +3 Resturlaub Vorjahr, −1 Korrektur)</span></div>
    <input type="text" id="ax" placeholder="Grund, z. B. Resturlaub 2025" style="margin-top:12px" maxlength="120">
    <button class="act" style="width:100%;margin-top:14px" onclick="vacAdjSave(${p},'${y}')">Korrektur speichern</button></div>
   <div class="gt">Bisherige Korrekturen</div><div class="group">${list || '<div class="row"><div class="small">Keine.</div></div>'}</div>`, true);
  idle(240);
}
function adjStep(d) { const el = $('#an'), v = Number(String(el.value).replace(',', '.')) || 0; el.value = nf(v + d); }
function vacAdjSave(p, y) {
  const n = Math.round(Number(String($('#an').value).replace(',', '.')) * 2) / 2, x = $('#ax').value.trim();
  if (!n) { alert('Bitte eine Anzahl Tage eingeben (z. B. 3 oder -1,5).'); return; }
  if (!x) { alert('Bitte kurz den Grund angeben.'); return; }
  D.vacAdj = D.vacAdj || {}; ((D.vacAdj[p] = D.vacAdj[p] || {})[y] = D.vacAdj[p][y] || []).push({ id: 'i' + rnd(6), n, x, ts: Date.now(), src: 'ipad' });
  const m = D.team.find(z => z.p === p); logx(`Urlaubskonto ${m.name} ${y}: ${n > 0 ? '+' : ''}${nf(n)} Tage – ${x}`); store(true); admin('vac');
}

/* ---------- Uhr & Live-Aktualisierung ---------- */
let lastDay = '', lastMin = '';
function tick() {
  const n = new Date(), d = dkey(n), m = hm(n);
  $('#clock').textContent = m; $('#date').textContent = WDL[(n.getDay() + 6) % 7] + ', ' + n.getDate() + '. ' + MONTHS[n.getMonth()];
  if (d !== lastDay || m !== lastMin) { const first = !lastDay; lastDay = d; lastMin = m; if (!$('#modal').innerHTML) home(); else if (first) home(); }
}
$('#btn-admin').onclick = askAdmin;
load(); odLoad(); home(); tick(); setInterval(tick, 1000); autoInit(); odInit();
</script>
