}

  --head:#171718;--head-text:#F4F4F4;--head-muted:#A0A0A8;

  --ok:#5BE584;--ok-dot:#30D158;--ok-soft:rgba(48,209,88,.14);--warn:#FFB340;--warn-dot:#FF9F0A;--warn-soft:rgba(255,159,10,.15);--bad:#FF6961;--bad-dot:#FF453A;--bad-soft:rgba(255,69,58,.15);
  --info:#64A8FF;--info-soft:rgba(10,132,255,.16);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);--shadow-lg:0 24px 70px rgba(0,0,0,.6);color-scheme:dark;
}}
:root[data-theme=dark]{
  --bg:#121213;--card:#1C1C1E;--card2:#252527;--ink:#F4F4F4;--text:#D4D4D8;--muted:#A0A0A8;--line:rgba(255,255,255,.11);
  --head:#171718;--head-text:#F4F4F4;--head-muted:#A0A0A8;

  --ok:#5BE584;--ok-dot:#30D158;--ok-soft:rgba(48,209,88,.14);--warn:#FFB340;--warn-dot:#FF9F0A;--warn-soft:rgba(255,159,10,.15);--bad:#FF6961;--bad-dot:#FF453A;--bad-soft:rgba(255,69,58,.15);

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:manipulation}
button,input,select{font-family:inherit}
button{cursor:pointer;transition:transform .14s ease,background-color .2s ease,box-shadow .2s ease,opacity .2s ease}
button:active{transform:scale(.98)}
header{position:sticky;top:0;z-index:10;background:var(--head);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);color:var(--head-text);padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 28px) 14px calc(env(safe-area-inset-left) + 28px);display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
header{background:linear-gradient(to bottom,#18181A 0,#18181A env(safe-area-inset-top),var(--head) env(safe-area-inset-top));box-shadow:0 1px 0 rgba(24,24,26,.06),0 8px 24px rgba(24,24,26,.05)}
.logo-img{height:66px;width:auto;display:block;flex:none}.brand-sub{font-size:13.5px;color:var(--head-muted);padding-left:14px;border-left:1px solid var(--line);line-height:1.2}
.gear{background:rgba(24,24,26,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .gear{background:rgba(255,255,255,.10)}}
:root[data-theme=dark] .gear{background:rgba(255,255,255,.10)}
.logo{height:44px;padding:0 13px;border-radius:12px;display:grid;place-items:center;flex:none;background:linear-gradient(180deg,#1E2740,#0B101C);box-shadow:inset 0 0 0 1px rgba(227,203,170,.28),0 2px 10px rgba(0,0,0,.35)}.logo span{font-family:"Lora","Iowan Old Style","Palatino","Georgia",serif;font-weight:600;font-size:17px;letter-spacing:.08em;background:linear-gradient(180deg,#F6EBDC,#E3CBAA 55%,#C4A27A);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.brand b{display:block;font-size:17px;font-weight:600;letter-spacing:-.01em}
.brand small{display:block;font-size:12.5px;color:var(--head-muted);margin-top:1px}
.hright{display:flex;align-items:center;gap:20px}
.clock{font-size:36px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1;text-align:right}
.date{font-size:12.5px;color:var(--head-muted);text-align:right;margin-top:4px}
.gear{position:relative;width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:var(--head-text);display:grid;place-items:center}
.gear svg{width:22px;height:22px}
.badge{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bad-dot);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid #0F172A}
.badge.warn{background:var(--warn-dot)}
main{padding:28px calc(env(safe-area-inset-right) + 28px) 12px calc(env(safe-area-inset-left) + 28px);max-width:1180px;margin:0 auto}
.greet{display:flex;align-items:baseline;justify-content:space-between;margin:2px 4px 18px;gap:12px;flex-wrap:wrap}
.greet h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.greet span{font-size:15px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.tile{position:relative;background:var(--card);border:0;border-radius:var(--r);padding:22px;text-align:left;color:inherit;min-height:176px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);overflow:hidden}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid var(--line);pointer-events:none}
.tile .top{display:flex;align-items:center;gap:14px}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:21px;font-weight:600;background:var(--accent-soft);color:var(--accent);flex:none}

<script>
/* ======================================================================
   SVNC Zeiterfassung (iPad) · Daten lokal auf diesem Gerät

   Safari auf dem iPad erlaubt das nicht -> Übertragen per Teilen-Dialog.
   ====================================================================== */
const LS = 'svnc_stempel_v1';
const p2 = n => String(n).padStart(2, '0');
const dkey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); };
const hm = ts => { const d = new Date(ts); return p2(d.getHours()) + ':' + p2(d.getMinutes()); };
const dfmt = s => s.slice(8, 10) + '.' + s.slice(5, 7) + '.' + s.slice(0, 4);
const tsAt = (day, t) => { const [y, m, d] = day.split('-').map(Number), [h, mi] = t.split(':').map(Number); return new Date(y, m - 1, d, h, mi, 0, 0).getTime(); };
const wdMon = day => (new Date(day + 'T12:00').getDay() + 6) % 7; // Mo=0 … So=6 (wie Personalplanung)
const WDS = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'], WDL = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];
const MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const dec1 = h => (Math.round(h * 10) / 10).toFixed(1).replace('.', ',');
const hmin = m => m == null ? '–' : Math.floor(m / 60) + ':' + p2(Math.round(m % 60));
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = s => document.querySelector(s);
const TYPES = { in: 'Kommen', ps: 'Pause Beginn', pe: 'Pause Ende', out: 'Gehen' };
const today = () => dkey(Date.now()), yesterday = () => dkey(Date.now() - 86400000);
// Öffnungszeiten-Standard (wie Personalplanung): Di–Fr 09–13 / 14–18, Sa 08–14 ohne Mittagspause
const DEF_HOURS = [{}, { a1: '09:00', a2: '13:00', b1: '14:00', b2: '18:00' }, { a1: '09:00', a2: '13:00', b1: '14:00', b2: '18:00' }, { a1: '09:00', a2: '13:00', b1: '14:00', b2: '18:00' }, { a1: '09:00', a2: '13:00', b1: '14:00', b2: '18:00' }, { a1: '08:00', a2: '14:00' }, {}];

let D;
function load() {
  try { D = JSON.parse(localStorage.getItem(LS)) || null; } catch (e) { D = null; }
  if (!D) D = { team: [], pins: {}, admin: '', salt: rnd(16), events: [], device: 'iPad-' + rnd(4), lastExport: 0, fails: {} };
  D.fails = D.fails || {}; D.log = D.log || []; D.unsynced = D.unsynced || 0; D.hours = D.hours || null; D.vacReqs = D.vacReqs || []; D.vacAdj = D.vacAdj || {}; D.sick = D.sick || []; D.dev = D.dev || [];
  if ((D.team || []).length && !D.teamAt) { D.teamAt = 1; D.unsynced = (D.unsynced || 0) + 1; try { localStorage.setItem(LS, JSON.stringify(D)); } catch (e) {} } // Team einmal nach OneDrive geben
}
function store(changed) { if (changed) D.unsynced = (D.unsynced || 0) + 1; try { localStorage.setItem(LS, JSON.stringify(D)); } catch (e) { alert('Speichern auf diesem Gerät nicht möglich!'); } if (changed) autoQueue(); }
function dropIpadAdj(a) { const o = {}; Object.entries(a || {}).forEach(([p, ys]) => Object.entries(ys || {}).forEach(([y, l]) => { const k = (l || []).filter(c => c.src !== 'ipad'); if (k.length) ((o[p] = o[p] || {})[y] = k); })); return o; }
function logx(x) { D.log.push({ ts: Date.now(), x }); if (D.log.length > 3000) D.log.splice(0, D.log.length - 3000); }
function rnd(n) { const a = new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a, b => b.toString(16).padStart(2, '0')).join(''); }
async function hash(s) {
  const data = new TextEncoder().encode(D.salt + '|' + s);
  if (crypto.subtle) { const h = await crypto.subtle.digest('SHA-256', data); return Array.from(new Uint8Array(h), b => b.toString(16).padStart(2, '0')).join(''); }
  let h = 5381; for (const b of data) h = ((h << 5) + h + b) >>> 0; return 'x' + h.toString(16);
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

/* ---------- Tagesauswertung inkl. fester Mittagspause ---------- */
const hoursOf = day => ((D.hours || DEF_HOURS)[wdMon(day)]) || {};
function lunchOf(day) { const h = hoursOf(day); return h.a2 && h.b1 ? [tsAt(day, h.a2), tsAt(day, h.b1)] : null; }
function closeOf(day) { const h = hoursOf(day); const c = h.b2 || h.a2; return c ? tsAt(day, c) : null; }
const live = () => D.events.filter(e => !e.del);
function evsOf(p, day) { return live().filter(e => e.p === p && dkey(e.ts) === day).sort((a, b) => a.ts - b.ts); }

function daySum(p, day, now) {
  const ev = evsOf(p, day); const r = { b: null, e: null, open: false, pm: 0, pa: null, net: null, lunch: 0, n: ev.length };
  if (!ev.length) return r;
  const iv = []; let mark = null;
  ev.forEach(x => {
    if (x.t === 'in') { if (r.b == null) r.b = x.ts; else if (mark != null) iv.push([mark, x.ts]); mark = null; }
    else if (x.t === 'ps') { mark = x.ts; }
    else if (x.t === 'pe') { if (mark != null) iv.push([mark, x.ts]); mark = null; }
    else if (x.t === 'out') { r.e = x.ts; mark = x.ts; }
  });
  const last = ev[ev.length - 1];
  if (last.t !== 'out') { r.e = null; r.open = true; }
  const end = r.e != null ? r.e : (now && day === today() ? now : null);
  if (r.open && last.t === 'ps' && end) iv.push([last.ts, end]);
  if (r.b == null || end == null) return r;
  const L = lunchOf(day); // feste Salon-Mittagspause Di–Fr
  if (L) { const a = Math.max(L[0], r.b), z = Math.min(L[1], end); if (z > a) { iv.push([a, z]); } }
  iv.sort((x, y) => x[0] - y[0]); const mg = [];
  iv.forEach(v => { if (v[1] <= v[0]) return; const t = mg[mg.length - 1]; if (t && v[0] <= t[1]) t[1] = Math.max(t[1], v[1]); else mg.push([v[0], v[1]]); });

function aVac() {
  const pend = D.vacReqs.filter(r => r.status === 'pending').sort((a, b) => a.from < b.from ? -1 : 1);
  const inbox = pend.map(r => { const per = reqDays(r), y = r.from.slice(0, 4), a = acct(r.p, y), n = per[y] || 0, ov = overlaps(r), own = ownClash(r);
    const after = a.none ? null : a.rest - n, rc = after == null ? 'var(--muted)' : after < 0 ? 'var(--bad)' : 'var(--ok)';
    return `<div class="req"><div class="rq-h"><div style="display:flex;gap:12px;align-items:center"><div class="av" style="width:44px;height:44px;font-size:17px">${esc(r.name.slice(0, 1))}</div><div><div class="t" style="font-size:17px;font-weight:600">${esc(r.name)}</div><div class="d">${span(r)} · <b>${nf(sumV(per))} Arbeitstage</b> · gestellt ${dfmt(dkey(r.created))}</div></div></div>
      <div class="rq-k">${a.none ? '<span class="small">kein Konto</span>' : `<span class="small">Rest ${y}</span><b>${nf(a.rest)}</b><span class="small">→</span><b style="color:${rc}">${nf(after)}</b>`}</div></div>
      ${r.note ? `<div class="small" style="margin-top:8px">„${esc(r.note)}“</div>` : ''}
      ${ov.length ? `<div class="note" style="margin-top:10px">Gleichzeitig weg: ${esc(ov.join('; '))}</div>` : ''}${own ? '<div class="note bad" style="margin-top:10px">Überschneidet sich mit eigenem Urlaub.</div>' : ''}${after != null && after < 0 ? '<div class="note bad" style="margin-top:10px">Resturlaub reicht nicht.</div>' : ''}
      <div class="btns" style="margin-top:12px"><input type="text" id="rr-${r.id}" placeholder="Antwort (optional)" style="flex:1;min-width:180px"><button class="btn danger" onclick="vacDecide('${r.id}','rejected')">Ablehnen</button><button class="btn pri ok" onclick="vacDecide('${r.id}','approved')">Genehmigen</button></div></div>`; }).join('');
  const applied0 = new Set((D.snap && D.snap.applied) || []);
  const cxHtml = D.vacReqs.filter(cxAsk).sort((a, b) => a.from < b.from ? -1 : 1).map(r => `<div class="req"><div class="rq-h"><div style="display:flex;gap:12px;align-items:center"><div class="av" style="width:44px;height:44px;font-size:17px">${esc(r.name.slice(0, 1))}</div><div><div class="t" style="font-size:17px;font-weight:600">${esc(r.name)}</div><div class="d">${span(r)} · <b>${nf(sumV(reqDays(r)))} Arbeitstage</b> · angefragt ${dfmt(dkey(r.cx.ts))}</div></div></div></div>
      ${r.cx.note ? `<div class="small" style="margin-top:8px">Grund: „${esc(r.cx.note)}“</div>` : ''}
      ${applied0.has(r.id) ? '<div class="note" style="margin-top:10px">Schon im Monatsplan der Personalplanung eingetragen. Bei Bestätigung wird er dort beim nächsten „Stempelzeiten abholen“ automatisch wieder entfernt (außer der Monat ist dort abgeschlossen).</div>' : ''}
      <div class="btns" style="margin-top:12px"><input type="text" id="rr-${r.id}" placeholder="Antwort (optional)" style="flex:1;min-width:180px"><button class="btn danger" onclick="vacCxNo('${r.id}')">Ablehnen</button><button class="btn pri ok" onclick="vacDecide('${r.id}','cancelled')">Stornierung bestätigen</button></div></div>`).join('');
  const ys = vacYears();
  const konten = D.team.map(m => ys.map((y, i) => { const a = acct(m.p, y);
    return `<tr><td>${i ? '' : `<b>${esc(m.name)}</b>`}</td><td>${y}</td>${a.none ? '<td class="r" colspan=5 style="color:var(--muted)">nicht hinterlegt</td>' : `<td class="r">${nf(a.base)}</td><td class="r">${a.adj ? (a.adj > 0 ? '+' : '') + nf(a.adj) : '–'}</td><td class="r">${nf(a.booked)}</td><td class="r">${a.pend ? nf(a.pend) : '–'}</td><td class="r"><b style="color:${a.rest < 0 ? 'var(--bad)' : 'var(--ink)'}">${nf(a.rest)}</b></td>`}<td class="r"><button class="btn" style="padding:7px 12px" onclick="vacAdjForm(${m.p},'${y}')">Anpassen</button></td></tr>`; }).join('')).join('');
  const t = today(), appr = D.vacReqs.filter(r => r.status === 'approved' && r.to >= t).sort((a, b) => a.from < b.from ? -1 : 1);
  const applied = new Set((D.snap && D.snap.applied) || []);
  const up = appr.map(r => `<div class="row"><div><div class="t">${esc(r.name)} · ${span(r)}</div><div class="d">${nf(sumV(reqDays(r)))} Arbeitstage${cxAsk(r) ? ' · <b>Stornierung angefragt</b>' : ''} · ${applied.has(r.id) ? 'im Monatsplan eingetragen' : 'wird beim nächsten Abholen in den Monatsplan übernommen'}</div></div><button class="btn danger" onclick="vacDecide('${r.id}','cancelled')">Stornieren</button></div>`).join('');
  return `${cxHtml ? `<div class="gt">Stornierungsanfragen</div>${cxHtml}` : ''}<div class="gt">Offene Anträge</div>${inbox || '<div class="group"><div class="row"><div style="display:flex;gap:12px;align-items:center"><span class="dot ok"></span><div class="t">Keine offenen Anträge</div></div></div></div>'}
   <div class="gt">Urlaubskonten · ${snapNote()}</div><div class="group" style="padding:4px 14px"><table><tr><th>Mitarbeiter(in)</th><th>Jahr</th><th class="r">Anspruch</th><th class="r">Korrektur</th><th class="r">Verplant</th><th class="r">Beantragt</th><th class="r">Rest</th><th></th></tr>${konten}</table></div>
   <div class="gt">Genehmigter Urlaub (kommend)</div><div class="group">${up || '<div class="row"><div class="small">Kein kommender Urlaub genehmigt.</div></div>'}</div>
   <p class="small">Genehmigte Anträge werden beim nächsten „Stempelzeiten abholen“ in der Personalplanung automatisch als Urlaub (U bzw. ½ Urlaub) in den Monatsplan eingetragen und vom Urlaubskonto abgezogen. Korrekturen hier (z. B. Resturlaub aus dem Vorjahr) werden ebenfalls übernommen.</p>`;
}
function vacDecide(id, st) {
  const r = D.vacReqs.find(x => x.id === id); if (!r) return; const inp = $('#rr-' + id), reason = inp ? inp.value.trim() : '';
  if (st === 'approved') { const y = r.from.slice(0, 4), a = acct(r.p, y), n = reqDays(r)[y] || 0; if (!a.none && a.rest - n < 0 && !confirm(`Der Resturlaub von ${r.name} reicht nicht (${nf(a.rest)} Tage, beantragt ${nf(n)}). Trotzdem genehmigen?`)) return; }
  if (st === 'cancelled' && !cxAsk(r) && !confirm(`Genehmigten Urlaub von ${r.name} (${span(r)}) stornieren?`)) return;
  const wasApplied = st === 'cancelled' && ((D.snap && D.snap.applied) || []).includes(r.id);
  if (st === 'cancelled' && r.cx && r.cx.st === 'ask') r.cx.st = 'done';
  r.status = st; r.reason = reason; r.decided = Date.now(); r.seen = 0; r.rev = (r.rev || 1) + 1;
  logx(`Urlaub ${r.name} ${span(r)}: ${VST[st][0]}${reason ? ' – ' + reason : ''}`); store(true); admin('vac');
  if (wasApplied) alert(`Der Urlaub von ${r.name} (${span(r)}) ist in der Personalplanung schon eingetragen. Er wird dort beim nächsten „Stempelzeiten abholen“ automatisch entfernt, außer der Monat ist abgeschlossen.`);
}
function vacCxNo(id) {
  const r = D.vacReqs.find(x => x.id === id); if (!r || !cxAsk(r)) return; const inp = $('#rr-' + id), reason = inp ? inp.value.trim() : '';
  r.cx.st = 'rejected'; r.cx.reason = reason; r.cx.dts = Date.now(); r.cx.seen = 0; r.rev = (r.rev || 1) + 1;
  logx(`Stornierung ${r.name} ${span(r)}: abgelehnt${reason ? ' – ' + reason : ''}`); store(true); admin('vac');
}
function vacAdjForm(p, y) {
  const m = D.team.find(x => x.p === p), list = adjOf(p, y).map(a => `<div class="row"><div><div class="t">${a.n > 0 ? '+' : ''}${nf(a.n)} Tage</div><div class="d">${esc(a.x || '')} · ${dfmt(dkey(a.ts))}</div></div></div>`).join('');
  modal(`<div class="ahead"><h3>Urlaubskonto anpassen</h3><button class="btn" onclick="admin('vac')">Zurück</button></div><div class="sub">${esc(m.name)} · ${y}</div>
   ${acctTiles(p, y, true)}
   <div class="gt">Korrektur hinzufügen</div><div class="group" style="padding:16px 18px">
    <div class="stepper"><button class="btn" onclick="adjStep(-0.5)">−</button><input type="text" inputmode="decimal" id="an" value="0"><button class="btn" onclick="adjStep(0.5)">+</button><span class="small">Tage (z. B. +3 Resturlaub Vorjahr, −1 Korrektur)</span></div>
    <input type="text" id="ax" placeholder="Grund, z. B. Resturlaub 2025" style="margin-top:12px" maxlength="120">
    <button class="act" style="width:100%;margin-top:14px" onclick="vacAdjSave(${p},'${y}')">Korrektur speichern</button></div>
   <div class="gt">Bisherige Korrekturen</div><div class="group">${list || '<div class="row"><div class="small">Keine.</div></div>'}</div>`, true);
  idle(240);
}
function adjStep(d) { const el = $('#an'), v = Number(String(el.value).replace(',', '.')) || 0; el.value = nf(v + d); }
function vacAdjSave(p, y) {
  const n = Math.round(Number(String($('#an').value).replace(',', '.')) * 2) / 2, x = $('#ax').value.trim();
  if (!n) { alert('Bitte eine Anzahl Tage eingeben (z. B. 3 oder -1,5).'); return; }
  if (!x) { alert('Bitte kurz den Grund angeben.'); return; }
  D.vacAdj = D.vacAdj || {}; ((D.vacAdj[p] = D.vacAdj[p] || {})[y] = D.vacAdj[p][y] || []).push({ id: 'i' + rnd(6), n, x, ts: Date.now(), src: 'ipad' });
  const m = D.team.find(z => z.p === p); logx(`Urlaubskonto ${m.name} ${y}: ${n > 0 ? '+' : ''}${nf(n)} Tage – ${x}`); store(true); admin('vac');
}

/* ---------- Uhr & Live-Aktualisierung ---------- */
let lastDay = '', lastMin = '';
function tick() {
  const n = new Date(), d = dkey(n), m = hm(n);
  $('#clock').textContent = m; $('#date').textContent = WDL[(n.getDay() + 6) % 7] + ', ' + n.getDate() + '. ' + MONTHS[n.getMonth()];
  if (d !== lastDay || m !== lastMin) { const first = !lastDay; lastDay = d; lastMin = m; if (!$('#modal').innerHTML) home(); else if (first) home(); }
}
$('#btn-admin').onclick = askAdmin;
load(); odLoad(); home(); tick(); setInterval(tick, 1000); autoInit(); odInit();
</script>
</body>
</html>
